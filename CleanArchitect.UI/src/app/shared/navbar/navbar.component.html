<nav class="navbar is-primary" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item" routerLink="/">
            <strong>Clean Architect</strong>
        </a>
        <a role="button" class="navbar-burger" [class.is-active]="menuOpen()" aria-label="menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>

    <div class="navbar-menu" [class.is-active]="menuOpen()">
        <div class="navbar-start">
            <a class="navbar-item" routerLink="/" (click)="closeMenus()">Home</a>
        </div>

        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons has-addons">
                    <button
                        type="button"
                        class="button is-small"
                        [class.is-primary]="currency.currency() === 'USD'"
                        (click)="currency.setCurrency('USD')"
                        aria-label="US Dollar"
                    >
                        🇺🇸
                    </button>
                    <button
                        type="button"
                        class="button is-small"
                        [class.is-primary]="currency.currency() === 'GBP'"
                        (click)="currency.setCurrency('GBP')"
                        aria-label="British Pound"
                    >
                        🇬🇧
                    </button>
                    <button
                        type="button"
                        class="button is-small"
                        [class.is-primary]="currency.currency() === 'EUR'"
                        (click)="currency.setCurrency('EUR')"
                        aria-label="Euro"
                    >
                        🇩🇪
                    </button>
                    <button
                        type="button"
                        class="button is-small"
                        [class.is-primary]="currency.currency() === 'VND'"
                        (click)="currency.setCurrency('VND')"
                        aria-label="Vietnam Dong"
                    >
                        🇻🇳
                    </button>
                </div>
            </div>
            <a class="navbar-item" routerLink="/cart" (click)="closeMenus()" style="position: relative" aria-label="Cart">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </span>
                @if (cart.count() > 0) {
                    <span class="tag is-danger is-rounded" style="position: absolute; top: 2px; right: 2px; font-size: 0.6rem">{{
                        cart.count()
                    }}</span>
                }
            </a>
            @if (auth.isAuthenticated()) {
                <div class="navbar-item has-dropdown" [class.is-active]="userMenuOpen()">
                    <a class="navbar-link" (click)="toggleUserMenu()">{{ auth.user()?.name || auth.user()?.email }}</a>
                    <div class="navbar-dropdown is-right">
                        @if (!auth.user()?.roles?.includes('Admin')) {
                            <a class="navbar-item" routerLink="/profile" (click)="closeMenus()">Profile</a>
                        }
                        @if (auth.user()?.roles?.includes('Admin')) {
                            <a class="navbar-item" routerLink="/admin/product" (click)="closeMenus()">Products</a>
                            <a class="navbar-item" routerLink="/admin/order" (click)="closeMenus()">Orders</a>
                        }
                        <a class="navbar-item" (click)="logout()">Logout</a>
                    </div>
                </div>
            } @else {
                <div class="navbar-item">
                    <div class="buttons">
                        <a class="button is-light" routerLink="/login" (click)="closeMenus()">Log in</a>
                        <a class="button is-primary is-inverted" routerLink="/register" (click)="closeMenus()">Register</a>
                    </div>
                </div>
            }
        </div>
    </div>
</nav>

<nav class="navbar is-primary" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item" routerLink="/">
            <strong>Clean Architect</strong>
        </a>
        <a role="button" class="navbar-burger" [class.is-active]="menuOpen()" aria-label="menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>

    <div class="navbar-menu" [class.is-active]="menuOpen()">
        <div class="navbar-start">
            <a class="navbar-item" routerLink="/" (click)="menuOpen.set(false)">Home</a>
            @if (auth.user()?.roles?.includes('Admin')) {
                <a class="navbar-item" routerLink="/admin/product" (click)="menuOpen.set(false)">Products</a>
            }
        </div>

        <div class="navbar-end">
            @if (auth.isAuthenticated()) {
                <span class="navbar-item">{{ auth.user()?.name || auth.user()?.email }}</span>
                <div class="navbar-item">
                    <button type="button" class="button is-danger" [disabled]="busy()" (click)="logout()">Sign out</button>
                </div>
            } @else {
                <div class="navbar-item">
                    <div class="buttons">
                        <a class="button is-light" routerLink="/login" (click)="menuOpen.set(false)">Log in</a>
                        <a class="button is-primary is-inverted" routerLink="/register" (click)="menuOpen.set(false)">Register</a>
                    </div>
                </div>
            }
        </div>
    </div>
</nav>

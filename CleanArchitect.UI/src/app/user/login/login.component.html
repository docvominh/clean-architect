<main class="auth-card">
    <p class="eyebrow">CLEAN ARCHITECT</p>
    <h1>Welcome back</h1>
    <p>Sign in to continue to your account.</p>
    <form #form="ngForm" (ngSubmit)="submit()">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required email autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" />
        @if (error()) {
            <p role="alert" class="error">{{ error() }}</p>
        }
        <button type="submit" [disabled]="form.invalid || busy()">{{ busy() ? 'Please wait...' : 'Sign in' }}</button>
    </form>
    <p>
        <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }"> New here? Create an account </a>
    </p>
</main>

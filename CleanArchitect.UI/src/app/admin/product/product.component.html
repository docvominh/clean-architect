<main class="auth-card">
    <p class="eyebrow">CLEAN ARCHITECT</p>
    <h1>{{ isEdit ? 'Edit product' : 'New product' }}</h1>

    @if (loading()) {
        <p>Loading...</p>
    } @else {
        <form #form="ngForm" (ngSubmit)="submit()">
            <label for="name">Name</label>
            <input id="name" name="name" [(ngModel)]="name" required />

            <label for="manufacturer">Manufacturer</label>
            <input id="manufacturer" name="manufacturer" [(ngModel)]="manufacturer" required />

            <label for="price">Price</label>
            <input id="price" name="price" type="number" min="0" step="0.01" [(ngModel)]="price" required />

            <label for="priceDiscount">Discounted price</label>
            <input id="priceDiscount" name="priceDiscount" type="number" min="0" step="0.01" [(ngModel)]="priceDiscount" />

            <label for="imageUrl">Image URL</label>
            <input id="imageUrl" name="imageUrl" [(ngModel)]="imageUrl" />

            <label for="description">Description</label>
            <input id="description" name="description" [(ngModel)]="description" />

            @if (error()) {
                <p role="alert" class="error">{{ error() }}</p>
            }
            <button type="submit" [disabled]="form.invalid || busy()">{{ busy() ? 'Please wait...' : isEdit ? 'Save changes' : 'Create product' }}</button>
        </form>
    }
    <p>
        <a routerLink="/admin/product">Back to products</a>
    </p>
</main>

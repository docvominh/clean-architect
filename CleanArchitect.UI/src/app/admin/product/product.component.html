<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-half">
                <div class="box">
                    <p class="heading">Clean Architect</p>
                    <h1 class="title">{{ isEdit ? 'Edit product' : 'New product' }}</h1>

                    @if (loading()) {
                        <p>Loading...</p>
                    } @else {
                        <form #form="ngForm" (ngSubmit)="submit()">
                            <div class="field">
                                <label class="label" for="name">Name</label>
                                <div class="control">
                                    <input class="input" id="name" name="name" [(ngModel)]="name" required />
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="manufacturer">Manufacturer</label>
                                <div class="control">
                                    <input class="input" id="manufacturer" name="manufacturer" [(ngModel)]="manufacturer" required />
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="price">Price</label>
                                <div class="control">
                                    <input class="input" id="price" name="price" type="number" min="0" step="0.01" [(ngModel)]="price" required />
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="priceDiscount">Discounted price</label>
                                <div class="control">
                                    <input
                                        class="input"
                                        id="priceDiscount"
                                        name="priceDiscount"
                                        type="number"
                                        min="0"
                                        step="0.01"
                                        [(ngModel)]="priceDiscount"
                                    />
                                </div>
                            </div>

                            <div class="field">
                                <label class="label" for="image">Image</label>
                                @if (previewUrl()) {
                                    <figure class="image is-128x128 mb-2">
                                        <img [src]="previewUrl()" alt="Product image preview" />
                                    </figure>
                                }
                                <div class="control">
                                    <input
                                        class="input"
                                        id="image"
                                        name="image"
                                        type="file"
                                        accept="image/png,image/jpeg,image/webp,image/gif"
                                        [disabled]="uploading()"
                                        (change)="onFileSelected($event)"
                                    />
                                </div>
                                @if (uploading()) {
                                    <p class="help">Uploading image...</p>
                                }
                            </div>

                            <div class="field">
                                <label class="label" for="description">Description</label>
                                <div class="control">
                                    <input class="input" id="description" name="description" [(ngModel)]="description" />
                                </div>
                            </div>

                            @if (error()) {
                                <p role="alert" class="help is-danger">{{ error() }}</p>
                            }
                            <div class="field">
                                <div class="control">
                                    <button type="submit" class="button is-primary is-fullwidth" [disabled]="form.invalid || busy() || uploading()">
                                        {{ busy() ? 'Please wait...' : isEdit ? 'Save changes' : 'Create product' }}
                                    </button>
                                </div>
                            </div>
                        </form>
                    }
                    <p>
                        <a routerLink="/admin/product">Back to products</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
